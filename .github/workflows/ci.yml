name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      FIELDNOTE_LLM: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Mypy
        run: mypy
      - name: Tests with coverage
        run: pytest --cov=fieldnote --cov-report=term --cov-report=xml
      - name: Offline demo and evals
        run: fieldnote demo
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fieldnote-ci-${{ matrix.python-version }}
          path: |
            coverage.xml
            out/eval_report.md
            out/*/briefs/
            out/*/memos/*.pdf
          if-no-files-found: ignore
